<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Schedule Maker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>School Schedule Maker</h1>
        
        <div class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <h2>Add Teachers & Classes</h2>
                
                <!-- Teacher Input -->
                <div class="form-group">
                    <label for="teacherName">Teacher Name:</label>
                    <input type="text" id="teacherName" placeholder="e.g., John Smith">
                </div>
                
                <div class="form-group">
                    <label for="className">Class Name:</label>
                    <input type="text" id="className" placeholder="e.g., Mathematics 101">
                </div>
                
                <div class="form-group">
                    <label for="duration">Class Duration (hours):</label>
                    <input type="number" id="duration" placeholder="e.g., 1.5" min="0.5" step="0.5">
                </div>
                
                <div class="form-group">
                    <label>Availability Time Slots:</label>
                    <div class="time-slots">
                        <div>
                            <label for="availStart">From:</label>
                            <input type="time" id="availStart" value="08:00">
                        </div>
                        <div>
                            <label for="availEnd">To:</label>
                            <input type="time" id="availEnd" value="17:00">
                        </div>
                    </div>
                </div>
                
                <button id="addTeacherBtn" class="btn btn-primary">Add Teacher & Class</button>
            </div>
            
            <!-- Teachers List Section -->
            <div class="teachers-section">
                <h2>Teachers & Classes</h2>
                <div id="teachersList" class="teachers-list"></div>
            </div>
            
            <!-- Constraints Section -->
            <div class="constraints-section">
                <h2>Add Constraints</h2>
                <p class="section-info">Set conditions like "Teacher X cannot teach at time Y"</p>
                
                <div class="form-group">
                    <label for="constraintTeacher">Select Teacher:</label>
                    <select id="constraintTeacher">
                        <option value="">-- Select a teacher --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="constraintType">Constraint Type:</label>
                    <select id="constraintType">
                        <option value="unavailable">Teacher Unavailable</option>
                        <option value="mustbefore">Class must finish before time</option>
                        <option value="mustafter">Class must start after time</option>
                    </select>
                </div>
                
                <div class="form-group" id="timeConstraintGroup">
                    <label for="constraintTime">Time:</label>
                    <input type="time" id="constraintTime" value="12:00">
                </div>
                
                <button id="addConstraintBtn" class="btn btn-secondary">Add Constraint</button>
            </div>
            
            <!-- Constraints List -->
            <div class="constraints-list-section">
                <h3>Active Constraints</h3>
                <div id="constraintsList" class="constraints-list"></div>
            </div>
            
            <!-- Generate Schedule Button -->
            <div class="generate-section">
                <button id="generateScheduleBtn" class="btn btn-success btn-large">Generate Schedule</button>
            </div>
        </div>
        
        <!-- Schedule Output Section -->
        <div id="scheduleSection" class="schedule-section" style="display: none;">
            <h2>Generated Schedule</h2>
            <div id="scheduleOutput" class="schedule-output"></div>
            <button id="resetBtn" class="btn btn-primary">Create New Schedule</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
